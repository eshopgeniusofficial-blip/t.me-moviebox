<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Match Landing Page</title>
<style>
  body {
    background: #0f1724;
    color: #e6eef6;
    font-family: "Poppins", sans-serif;
    margin: 0;
    padding: 20px;
  }

  h2 {
    text-align: center;
    color: #fff;
    margin-bottom: 20px;
  }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 8px 16px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    background: #14202b;
    color: #94a3b8;
    transition: 0.3s;
  }
  .tab.active {
    background: #00b4d8;
    color: #fff;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: #14202b;
    border-radius: 12px;
    overflow: hidden;
    max-width: 800px;
    margin: 0 auto;
  }
  th, td {
    padding: 12px;
    text-align: center;
    border-bottom: 1px solid #1e293b;
  }
  th {
    background: #1e293b;
    color: #00b4d8;
    text-transform: uppercase;
    font-size: 13px;
  }
  .league {
    color: #f87171;
    font-weight: bold;
  }
  .title {
    color: #e2e8f0;
    font-weight: bold;
  }
  .watch {
    color: #fff;
    background: #00b4d8;
    text-decoration: none;
    font-weight: bold;
    padding: 6px 12px;
    border-radius: 6px;
    transition: 0.2s;
    cursor: pointer;
  }
  .watch:hover {
    background: #0284c7;
  }
  .live {
    color: #ff3b3b;
    font-weight: bold;
    animation: blink 1s infinite;
  }
  @keyframes blink {
    50% { opacity: 0.3; }
  }
  .play {
    background: #16a34a;
    color: white;
    padding: 5px 10px;
    border-radius: 20px;
    font-weight: bold;
  }
  .ended {
    background: #64748b;
    color: white;
    padding: 5px 10px;
    border-radius: 20px;
    font-weight: bold;
  }
  .countdown {
    color: #f8fafc;
    font-weight: bold;
  }

  @media screen and (max-width: 768px) {
    body { padding: 10px; }
    table, th, td { font-size: 13px; padding: 8px; }
    h2 { font-size: 16px; }
  }
</style>
</head>
<body>

<h2>⚽ Live Football Matches & Upcoming Fixtures</h2>

<div class="tabs">
  <button class="tab active" data-filter="all">All (<span id="countAll">0</span>)</button>
  <button class="tab" data-filter="live">Live (<span id="countLive">0</span>)</button>
  <button class="tab" data-filter="upcoming">Upcoming (<span id="countUpcoming">0</span>)</button>
  <button class="tab" data-filter="ended">Ended (<span id="countEnded">0</span>)</button>
</div>

<table id="matchTable">
  <thead>
    <tr>
      <th>League</th>
      <th>Match</th>
      <th>Kickoff</th>
      <th>Countdown</th>
      <th>Link</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody>
    <!-- ✅ শুধু নিচের অংশ পরিবর্তন করবে -->
    <tr>
      <td class="league">UEFA U19</td>
      <td class="title">Real Madrid U19 vs Liverpool U19</td>
      <td>2025-11-04T21:00:00</td>
      <td class="countdown" data-time="2025-11-04T21:00:00"></td>
      <td><span class="watch" data-adlink="https://afflink.com/ad" data-match="https://livematch.com/match1">Watch</span></td>
      <td><span class="play status">PLAY</span></td>
    </tr>
    <tr>
      <td class="league">UEFA 25/26</td>
      <td class="title">Arsenal vs Slavia Praha</td>
      <td>2025-11-04T23:45:00</td>
      <td class="countdown" data-time="2025-11-04T23:45:00"></td>
      <td><span class="watch" data-adlink="https://afflink.com/ad" data-match="https://livematch.com/match2">Watch</span></td>
      <td><span class="play status">PLAY</span></td>
    </tr>
  </tbody>
</table>

<script>
function updateCountdowns() {
  const rows = document.querySelectorAll("#matchTable tbody tr");
  const now = new Date().getTime();
  const matchDuration = 2.5 * 60 * 60 * 1000; // 2.5 hours

  let liveCount = 0, upCount = 0, endCount = 0;

  rows.forEach(row => {
    const countdownEl = row.querySelector(".countdown");
    const statusEl = row.querySelector(".status");
    if (!countdownEl || !statusEl) return;

    const matchTime = new Date(countdownEl.dataset.time).getTime();
    const endTime = matchTime + matchDuration;
    const distance = matchTime - now;
    const endDistance = endTime - now;

    if (distance <= 0 && endDistance > 0) {
      countdownEl.innerHTML = '<span class="live">LIVE</span>';
      statusEl.textContent = "LIVE";
      statusEl.className = "status live";
      liveCount++;
      row.dataset.status = "live";
    } else if (endDistance <= 0) {
      countdownEl.textContent = "Match Ended";
      statusEl.textContent = "ENDED";
      statusEl.className = "status ended";
      endCount++;
      row.dataset.status = "ended";
    } else {
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const mins = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((distance % (1000 * 60)) / 1000);
      countdownEl.textContent = `${hours}h ${mins}m ${secs}s`;
      statusEl.textContent = "UPCOMING";
      statusEl.className = "status play";
      upCount++;
      row.dataset.status = "upcoming";
    }
  });

  document.getElementById("countAll").textContent = rows.length;
  document.getElementById("countLive").textContent = liveCount;
  document.getElementById("countUpcoming").textContent = upCount;
  document.getElementById("countEnded").textContent = endCount;
}

setInterval(updateCountdowns, 1000);
updateCountdowns();

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const f = btn.dataset.filter;
    document.querySelectorAll("#matchTable tbody tr").forEach(row => {
      if (f === "all" || row.dataset.status === f) row.style.display = "";
      else row.style.display = "none";
    });
  });
});

document.querySelectorAll(".watch").forEach(btn => {
  btn.addEventListener("click", function() {
    const adLink = this.dataset.adlink;
    const matchLink = this.dataset.match;
    if (adLink && matchLink) {
      window.open(adLink, "_blank");
      window.location.href = matchLink;
    }
  });
});
</script>

<p style="font-size:14px;color:#94a3b8;margin-top:30px;text-align:center;">

</p>

</body>
</html>
