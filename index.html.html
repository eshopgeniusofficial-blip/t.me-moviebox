<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Matches - Fixture</title>
<style>
  body {
    font-family: "Poppins", sans-serif;
    background: #0f172a;
    color: #fff;
    margin: 0;
    padding: 20px;
  }

  h2 { text-align: center; margin-bottom: 10px; }

  .filters {
    text-align: center;
    margin-bottom: 20px;
  }

  .filter-btn {
    background: #1e293b;
    color: #fff;
    border: none;
    padding: 10px 20px;
    margin: 0 5px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
  }

  .filter-btn.active {
    background: #22c55e;
    color: #0f172a;
  }

  .match-card {
    background: #1e293b;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 0 10px rgba(255,255,255,0.1);
    transition: 0.3s;
    position: relative;
  }

  .league-badge {
    position: absolute;
    top: -10px;
    left: -10px;
    background: #facc15;
    color: #0f172a;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 8px;
    font-size: 12px;
  }

  .teams {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
  }

  .team {
    text-align: center;
    width: 45%;
    position: relative;
  }

  .team img {
    width: 50px;
    height: 50px;
    object-fit: contain;
    border-radius: 50%;
    margin-bottom: 5px;
  }

  .vs {
    font-size: 18px;
    color: #facc15;
    font-weight: bold;
  }

  .time {
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
  }

  .watch-btn {
    text-align: center;
    margin-top: 8px;
  }

  .watch-btn a, .countdown {
    background: #22c55e;
    color: #fff;
    padding: 8px 18px;
    border-radius: 25px;
    text-decoration: none;
    transition: 0.3s;
    font-weight: 600;
    display: inline-block;
  }

  .watch-btn a:hover {
    background: #16a34a;
  }

  .countdown {
    background: #334155;
    color: #facc15;
  }

  .live-badge {
    position: absolute;
    top: -10px;
    right: -10px;
    background: red;
    color: #fff;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 8px;
    font-size: 12px;
    animation: blink 1s infinite;
    display: none;
  }

  @keyframes blink {
    0%,50%,100% {opacity:1;}
    25%,75% {opacity:0;}
  }

  @media (max-width: 600px) {
    .team img { width: 40px; height: 40px; }
    .vs { font-size: 16px; }
  }
</style>
</head>
<body>

<h2>⚽ Live Football Fixtures</h2>

<div class="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="live">Live</button>
  <button class="filter-btn" data-filter="upcoming">Upcoming</button>
</div>

<div id="match-container">
  <!-- MATCH 1 -->
  <div class="match-card" data-start="2025-11-09T02:00:00">
    <div class="league-badge">UEFA Champions League</div>
    <div class="teams">
      <div class="team">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/56/Real_Madrid_CF.svg" alt="Real Madrid">
        <div>Real Madrid</div>
      </div>
      <div class="vs">VS</div>
      <div class="team">
        <img src="https://upload.wikimedia.org/wikipedia/en/0/0c/Liverpool_FC.svg" alt="Liverpool">
        <div>Liverpool</div>
        <span class="live-badge">LIVE 🔴</span>
      </div>
    </div>
    <div class="time">⏰ Match Time: 2025-11-09T02:00:00</div>
    <div class="watch-btn">
      <span class="countdown" data-start="2025-11-09T02:00:00" data-link="https://yourlink.com"></span>
    </div>
  </div>

  <!-- MATCH 2 -->
  <div class="match-card" data-start="2025-11-09T04:00:00">
    <div class="league-badge">UEFA Champions League</div>
    <div class="teams">
      <div class="team">
        <img src="https://upload.wikimedia.org/wikipedia/en/1/15/FC_Barcelona.svg" alt="Barcelona">
        <div>Barcelona</div>
      </div>
      <div class="vs">VS</div>
      <div class="team">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/53/Bayern_Munich_logo.svg" alt="Bayern Munich">
        <div>Bayern Munich</div>
        <span class="live-badge">LIVE 🔴</span>
      </div>
    </div>
    <div class="time">⏰ Match Time: 2025-11-09T04:00:00</div>
    <div class="watch-btn">
      <span class="countdown" data-start="2025-11-09T04:00:00" data-link="https://yourlink.com"></span>
    </div>
  </div>

</div>

<script>
function updateCountdowns() {
  const matches = document.querySelectorAll('.match-card');
  const now = new Date().getTime();

  matches.forEach(match => {
    const countdownEl = match.querySelector('.countdown');
    const startTime = new Date(countdownEl.dataset.start).getTime();
    const link = countdownEl.dataset.link;
    const liveBadge = match.querySelector('.live-badge');

    const distance = startTime - now;

    if(distance <= 0){
      // Show Watch Now button
      countdownEl.outerHTML = `<a href="${link}" target="_blank">▶ Watch Now</a>`;
      // Show LIVE badge
      liveBadge.style.display = 'inline-block';
      match.dataset.status = 'live';
    } else {
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);
      countdownEl.textContent = `Starts in ${hours}h ${minutes}m ${seconds}s`;
      liveBadge.style.display = 'none';
      match.dataset.status = 'upcoming';
    }
  });
}

// Filter Buttons
const filterBtns = document.querySelectorAll('.filter-btn');
filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filter = btn.dataset.filter;
    const matches = document.querySelectorAll('.match-card');
    matches.forEach(match => {
      if(filter === 'all'){
        match.style.display = 'block';
      } else if(filter === 'live' && match.dataset.status === 'live'){
        match.style.display = 'block';
      } else if(filter === 'upcoming' && match.dataset.status === 'upcoming'){
        match.style.display = 'block';
      } else {
        match.style.display = 'none';
      }
    });
  });
});

setInterval(() => {
  updateCountdowns();
  // Trigger filter again to update visibility
  document.querySelector('.filter-btn.active').click();
}, 1000);

updateCountdowns();
</script>

</body>
</html>
