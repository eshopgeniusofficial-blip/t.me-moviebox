<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Matches - Fixture</title>
<style>
  body {
    font-family: "Poppins", sans-serif;
    background: #0f172a;
    color: #fff;
    margin: 0;
    padding: 20px;
  }

  .filters, .sport-filters {
    text-align: center;
    margin-bottom: 20px;
  }

  .filter-btn {
    background: #1e293b;
    color: #fff;
    border: none;
    padding: 10px 20px;
    margin: 0 5px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
  }

  .filter-btn.active {
    background: #22c55e;
    color: #0f172a;
  }

  .match-card {
    background: #1e293b;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 0 10px rgba(255,255,255,0.1);
    transition: 0.3s;
    position: relative;
  }

  .league-badge {
    position: absolute;
    top: -10px;
    left: -10px;
    background: #facc15;
    color: #0f172a;
    font-weight: bold;
    padding: 3px 8px;
    border-radius: 8px;
    font-size: 12px;
  }

  .teams {
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
  }

  .team {
    text-align: center;
    width: 45%;
    position: relative;
  }

  .team img {
    width: 50px;
    height: 50px;
    object-fit: contain;
    border-radius: 50%;
    margin-bottom: 5px;
  }

  .vs {
    font-size: 18px;
    color: #facc15;
    font-weight: bold;
  }

  .time {
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
  }

  .watch-btn {
    text-align: center;
    margin-top: 8px;
  }

  .watch-btn a, .countdown {
    background: #22c55e;
    color: #fff;
    padding: 8px 18px;
    border-radius: 25px;
    text-decoration: none;
    transition: 0.3s;
    font-weight: 600;
    display: inline-block;
  }

  .watch-btn a:hover {
    background: #16a34a;
  }

  .countdown {
    background: #334155;
    color: #facc15;
  }

  .live-badge {
    position: absolute;
    top: -10px;
    right: -10px;
    background: red;
    color: #fff;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 8px;
    font-size: 12px;
    animation: blink 1s infinite;
    display: none;
  }

  @keyframes blink {
    0%,50%,100% {opacity:1;}
    25%,75% {opacity:0;}
  }

  @media (max-width: 600px) {
    .team img { width: 40px; height: 40px; }
    .vs { font-size: 16px; }
  }
</style>
</head>
<body>

<!-- Sport Filters -->
<div class="sport-filters">
  <button class="filter-btn active" data-sport="all">All Sports</button>
  <button class="filter-btn" data-sport="football">Football⚽</button>
  <button class="filter-btn" data-sport="cricket">Cricket🏏</button>
</div>

<!-- Match Type Filters -->
<div class="filters">
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="live">Live</button>
  <button class="filter-btn" data-filter="upcoming">Upcoming</button>
</div>

<div id="match-container">
  <!-- FOOTBALL MATCH -->
  <div class="match-card" data-start="2025-11-09T07:00:00" data-sport="football">
    <div class="league-badge">USA Major League Soccer 1st Round</div>
    <div class="teams">
      <div class="team">
        <img src="https://blogger.googleusercontent.com/img/a/AVvXsEgoifxrJvuA96t9sLPAmHlGym_qN8urXiGx-vO5r3ewuqsa1TagmuDBpO6FyPKAYKiwkUITBLYHj9wvG9R5bXJ3O0jfH963dbvsGOwigCf0n_f1pUjAGkHiR1udqKYhgc7YI-AQsSD1PeZvJjMJPlfEZWxCG2pn8NPuOxF9FWgThOse6tj6kWrwnRPc2aXh" alt="Inter Miami">
        <div>Inter Miami</div>
      </div>
      <div class="vs">VS</div>
      <div class="team">
        <img src="https://blogger.googleusercontent.com/img/a/AVvXsEjceJgnkcjm3aGXzZBBlgAPlYxYjOP3MqRbiOMvJX7QJolA5GHcUUwBXQ8sxMWTnszt3iFtCH_DwbBUM6cvb4_Y5NcmFyh4vFKCCuLj3TR57qPxIg_kFLBjeHCMDxzKeyazt0e0myNNqCOtiOBBYPpRreDy_5rsAM-3K3t8fbjib9Tzx_-w0pSSFuKWHBnx" alt="Nashville">
        <div>Nashville</div>
        <span class="live-badge">LIVE 🔴</span>
      </div>
    </div>
    <div class="time">⏰ Match Time: 2025-11-09T02:00:00</div>
    <div class="watch-btn">
      <span class="countdown" data-start="2025-11-09T02:00:00" data-link="https://yourlink.com"></span>
    </div>
  </div>

  <!-- CRICKET MATCH -->
  <div class="match-card" data-start="2025-11-09T05:00:00" data-sport="cricket">
    <div class="league-badge">IPL 2025</div>
    <div class="teams">
      <div class="team">
        <img src="https://upload.wikimedia.org/wikipedia/en/5/5b/Chennai_Super_Kings_logo.svg" alt="Chennai Super Kings">
        <div>CSK</div>
      </div>
      <div class="vs">VS</div>
      <div class="team">
        <img src="https://upload.wikimedia.org/wikipedia/en/3/30/Mumbai_Indians_Logo.svg" alt="Mumbai Indians">
        <div>MI</div>
        <span class="live-badge">LIVE 🔴</span>
      </div>
    </div>
    <div class="time">⏰ Match Time: 2025-11-09T05:00:00</div>
    <div class="watch-btn">
      <span class="countdown" data-start="2025-11-09T05:00:00" data-link="https://yourlink.com"></span>
    </div>
  </div>
</div>

<script>
function updateCountdowns() {
  const matches = document.querySelectorAll('.match-card');
  const now = new Date().getTime();

  matches.forEach(match => {
    const countdownEl = match.querySelector('.countdown');
    const startTime = new Date(countdownEl.dataset.start).getTime();
    const link = countdownEl.dataset.link;
    const liveBadge = match.querySelector('.live-badge');

    const distance = startTime - now;

    if(distance <= 0){
      countdownEl.outerHTML = `<a href="${link}" target="_blank">▶ Watch Now</a>`;
      liveBadge.style.display = 'inline-block';
      match.dataset.status = 'live';
    } else {
      const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((distance % (1000 * 60)) / 1000);
      countdownEl.textContent = `Starts in ${hours}h ${minutes}m ${seconds}s`;
      liveBadge.style.display = 'none';
      match.dataset.status = 'upcoming';
    }
  });
}

// Match Type Filters
const typeFilterBtns = document.querySelectorAll('.filters .filter-btn');
typeFilterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    typeFilterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterMatches();
  });
});

// Sport Filters
const sportFilterBtns = document.querySelectorAll('.sport-filters .filter-btn');
sportFilterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    sportFilterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterMatches();
  });
});

function filterMatches() {
  const activeType = document.querySelector('.filters .filter-btn.active').dataset.filter;
  const activeSport = document.querySelector('.sport-filters .filter-btn.active').dataset.sport;
  const matches = document.querySelectorAll('.match-card');

  matches.forEach(match => {
    const status = match.dataset.status;
    const sport = match.dataset.sport;

    let typeShow = false;
    if(activeType === 'all') typeShow = true;
    else if(activeType === 'live' && status === 'live') typeShow = true;
    else if(activeType === 'upcoming' && status === 'upcoming') typeShow = true;

    let sportShow = false;
    if(activeSport === 'all') sportShow = true;
    else if(activeSport === sport) sportShow = true;

    match.style.display = (typeShow && sportShow) ? 'block' : 'none';
  });
}

setInterval(() => {
  updateCountdowns();
  filterMatches();
}, 1000);

updateCountdowns();
</script>

</body>
</html>
