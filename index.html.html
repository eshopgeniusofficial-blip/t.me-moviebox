<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Live Match Landing Page</title>
  <style>
    /* ======== BASE STYLE ======== */
    body {
      background: #0f1724;
      color: #e6eef6;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
    }

    /* ======== TAB BUTTONS ======== */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 15px;
    }
    .tab {
      padding: 8px 16px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      background: #14202b;
      color: #94a3b8;
      transition: all 0.2s ease;
      font-size: 14px;
    }
    .tab:hover {
      background: #1e2c3b;
    }
    .tab.active {
      background: #00b4d8;
      color: #fff;
    }

    /* ======== MATCH LIST ======== */
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 95%;
      max-width: 650px;
      margin: auto;
    }

    .match {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 12px;
      border-radius: 12px;
      background: #14202b;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .team {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 120px;
    }

    .team img {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: cover;
    }

    .countdown {
      font-weight: bold;
      text-align: center;
      min-width: 90px;
    }

    .live {
      color: #ff3b3b;
      font-weight: bold;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: 0.3; }
    }

    /* ======== RESPONSIVE DESIGN ======== */
    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .match {
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .team img {
        width: 40px;
        height: 40px;
      }
      .team span {
        font-size: 14px;
      }
      .tab {
        padding: 6px 12px;
        font-size: 13px;
      }
      .countdown {
        margin-top: 6px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="tabs">
    <button class="tab active" data-filter="all">All (<span id="countAll">0</span>)</button>
    <button class="tab" data-filter="live">Live (<span id="countLive">0</span>)</button>
    <button class="tab" data-filter="upcoming">Upcoming (<span id="countUpcoming">0</span>)</button>
  </div>

  <div class="match-list" id="matches"></div>

  <script>
    // === প্রতিদিন শুধু নিচের তালিকাটা আপডেট করলেই চলবে ===
    const matches = [
      {
        home: 'Al-Hazem',
        away: 'Al-Khaleej',
        homeLogo: 'https://upload.wikimedia.org/wikipedia/en/thumb/6/68/Al-Hazm_Logo.png/120px-Al-Hazm_Logo.png',
        awayLogo: 'https://upload.wikimedia.org/wikipedia/en/thumb/8/8b/Al-Khaleej_Club.png/120px-Al-Khaleej_Club.png',
        start: addMin(10)
      },
      {
        home: 'Al-Qadsiah',
        away: 'Al-Kholood',
        homeLogo: 'https://upload.wikimedia.org/wikipedia/en/thumb/7/78/Al_Qadsiah_FC_logo.png/120px-Al_Qadsiah_FC_logo.png',
        awayLogo: 'https://upload.wikimedia.org/wikipedia/en/thumb/5/5a/Al-Kholood_Club.png/120px-Al-Kholood_Club.png',
        start: addMin(60)
      },
      {
        home: 'Al-Riyadh',
        away: 'Damac FC',
        homeLogo: 'https://upload.wikimedia.org/wikipedia/en/thumb/0/0a/Al-Riyadh_SC.png/120px-Al-Riyadh_SC.png',
        awayLogo: 'https://upload.wikimedia.org/wikipedia/en/thumb/2/22/Damac_FC_logo.png/120px-Damac_FC_logo.png',
        start: addMin(-5)
      }
    ];

    function addMin(min) {
      let d = new Date();
      d.setMinutes(d.getMinutes() + min);
      return d;
    }

    const END_TIME = 150 * 60 * 1000; // 2.5 ঘণ্টা
    const matchList = document.getElementById('matches');

    function render() {
      matchList.innerHTML = '';
      matches.forEach((m, i) => {
        const div = document.createElement('div');
        div.className = 'match';
        div.dataset.index = i;
        div.innerHTML = `
          <div class='team'><img src='${m.homeLogo}'><span>${m.home}</span></div>
          <span>VS</span>
          <div class='team'><img src='${m.awayLogo}'><span>${m.away}</span></div>
          <div class='countdown' id='cd${i}'>--:--:--</div>
        `;
        matchList.appendChild(div);
      });
      updateCount();
    }

    function updateCount() {
      const now = new Date();
      document.getElementById('countAll').textContent = matches.length;
      document.getElementById('countLive').textContent = matches.filter(m => now >= m.start && now < m.start.getTime() + END_TIME).length;
      document.getElementById('countUpcoming').textContent = matches.filter(m => now < m.start).length;
    }

    function tick() {
      const now = new Date();
      matches.forEach((m, i) => {
        const cd = document.getElementById('cd' + i);
        if (now < m.start) {
          const diff = m.start - now;
          cd.textContent = format(diff);
        } else if (now < m.start.getTime() + END_TIME) {
          cd.innerHTML = '<span class="live">LIVE</span>';
        } else {
          cd.textContent = 'Match Ended';
        }
      });
      updateCount();
    }

    function format(ms) {
      const h = Math.floor(ms / 3600000),
            m = Math.floor((ms % 3600000) / 60000),
            s = Math.floor((ms % 60000) / 1000);
      return `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    function pad(n) {
      return n.toString().padStart(2, '0');
    }

    render();
    setInterval(tick, 1000);

    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const f = btn.dataset.filter;
        document.querySelectorAll('.match').forEach((m, i) => {
          const status = getStatus(matches[i]);
          m.style.display = (f === 'all' || status === f) ? 'flex' : 'none';
        });
      });
    });

    function getStatus(m) {
      const now = new Date();
      if (now < m.start) return 'upcoming';
      if (now < m.start.getTime() + END_TIME) return 'live';
      return 'ended';
    }
  </script>
</body>
</html>
